name: recon

# RECONNAISSANCE SEULE, declenchement MANUEL uniquement.
# Aucun cron : ce workflow ne doit jamais tourner tout seul.
# Il n'ecrit aucun fichier et ne commit rien -> il ne peut pas abimer la collecte.
# Groupe de concurrence distinct de "collect" pour ne pas bloquer les snapshots.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de reconnaissance a lancer"
        required: false
        default: "recon.py"

concurrency:
  group: recon
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconnaissance (lecture seule)
        run: |
          S="${{ inputs.script }}"
          case "$S" in
            recon*.py) python "$S" ;;
            # Simulation du patch de collecte : execute tout, n'ecrit rien.
            # Le garde-fou de l'etape suivante verifie qu'aucun fichier n'a bouge.
            dry-run) python collect_once.py --dry-run ;;
            *) echo "::error::script refuse : $S"; exit 1 ;;
          esac

      - name: Verifier qu'aucun fichier n'a ete touche
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::recon.py a modifie des fichiers — il ne devrait jamais"
            git status --porcelain
            exit 1
          fi
          echo "OK : aucun fichier modifie"
