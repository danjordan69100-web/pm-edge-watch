name: pm-edge-watch

on:
  schedule:
    # PATCH 14/09/2026 : tentative toutes les 2 h, PAS un snapshot toutes les 2 h.
    # Mesure sur 43 jours : '7 */4 * * *' ne rendait que 4 snapshots/jour, toujours
    # aux memes heures (04, 12, 19, 22 UTC) -- GitHub retarde les schedules de 2 a 4 h
    # sur les repos publics et absorbe ceux qui se chevauchent. En doublant les
    # tentatives, le garde-fou MIN_GAP_MINUTES (210) du script impose lui-meme un pas
    # regulier de ~4 h : une tentative trop rapprochee sort sans rien ecrire.
    - cron: '7 */2 * * *'    # tentative de snapshot, garde-fou cote script
    - cron: '40 3 * * *'     # balayage des resolutions, 1x/jour
  workflow_dispatch:

# Un seul run a la fois : deux jobs qui poussent en meme temps = conflit git.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecte
        run: |
          if [ "${{ github.event.schedule }}" = "40 3 * * *" ]; then
            python collect_once.py --resolve
          elif [ -n "${{ github.event.schedule }}" ]; then
            # Run planifie : soumis au garde-fou d'espacement.
            python collect_once.py --gap-guard
          else
            # Declenchement manuel : toujours un snapshot, sans garde-fou.
            python collect_once.py
          fi

      - name: Commit
        run: |
          git config user.name  "pm-edge-watch"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "rien de neuf"
            exit 0
          fi
          git commit -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          # Le repo peut avoir bouge entre le checkout et le push : on rejoue par-dessus.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "retry $i"
            sleep $((i * 5))
          done
          exit 1
